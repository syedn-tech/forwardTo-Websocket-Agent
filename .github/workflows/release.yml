name: Release ForwardTo Agent

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Multi-Platform Binaries
        working-directory: .
        run: |
          mkdir -p dist
          # Linux AMD64 & ARM64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/forwardto-agent-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/forwardto-agent-linux-arm64 main.go
          
          # macOS Intel & Apple Silicon
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/forwardto-agent-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/forwardto-agent-darwin-arm64 main.go
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/forwardto-agent-windows-amd64.exe main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
